# fork 覆盖 —— 本文件整体替换官方 .github/workflows/build_release.yml
#
# 官方原版流程做的事（GPG 签名提交、打 tag、changelog、Crowdin i18n 同步、
# npm 发布、正式/精简双版本构建）在 fork 里大多用不上，且依赖
# BOT_TOKEN / BOT_GPG_PRIVATE_KEY / CROWDIN_* 等 secrets，fork 里没有会直接失败，
# 因此改为下面这个自包含的精简流程。
#
# 产物结构与官方 build.sh --release --compress 完全一致，OpenList 后端可直接消费：
#   - 归档根目录为 "./"（不是 dist/）
#   - dist/VERSION 内含版本号
#   - 额外产出 i18n.tar.gz 多语言包
#
# 语言包：仓库不携带语言文件，构建时从官方 release 拉取 zh-CN（只解简体，
# 不引入 zh-TW）。因此 fork 里不需要提交任何语言包；代价是构建需能访问 GitHub。
#
# 若想连这最后一个冲突源也消掉：把本文件改名为 fork_release.yml，
# 官方同名文件保持原样即可（两者不会互相触发）。

name: Fork Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "前端版本号，例如 4.2.7（建议带 fork 后缀如 4.2.7-fork1，避免与上游 tag 撞名）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  fork-build-release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set frontend version
        run: |
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "VERSION_TAG=v${VERSION}" >> "$GITHUB_ENV"

      # i18n：拉官方 zh-CN 语言包（只解出 ./zh-CN，不要 zh-TW）。
      # 先按 I18N_REF 拉，失败退 edge；两次都失败直接中断，不发只有英文的包。
      - name: Prepare i18n
        env:
          I18N_REF: v4.2.7 # 升级前端版本时同步改这里
        run: |
          set -euo pipefail
          base="https://github.com/OpenListTeam/OpenList-Frontend/releases/download"
          curl -fL --retry 3 -o i18n.tar.gz "${base}/${I18N_REF}/i18n.tar.gz" \
            || curl -fL --retry 3 -o i18n.tar.gz "${base}/edge/i18n.tar.gz"
          tar -xzf i18n.tar.gz -C src/lang ./zh-CN
          rm -f i18n.tar.gz
          node ./scripts/i18n.mjs

      # ============ 标准版 ============
      - name: Build standard
        run: pnpm build

      - name: Package standard
        run: |
          set -e
          test -f dist/index.html
          echo -n "$VERSION_TAG" > dist/VERSION

          # 注意：-C dist . 让归档根目录为 "./"。直接 tar dist 会在解包后多一层
          # dist/，后端 build.sh 取不到文件。
          tar -czf "openlist-frontend-dist-${VERSION_TAG}.tar.gz" -C dist .

          tar -czf i18n.tar.gz --exclude=en -C src/lang .

          mkdir -p release
          mv "openlist-frontend-dist-${VERSION_TAG}.tar.gz" i18n.tar.gz release/

      # ============ 精简版 ============
      - name: Build lite
        run: pnpm build:lite

      - name: Package lite
        run: |
          set -e
          test -f dist/index.html
          echo -n "$VERSION_TAG" > dist/VERSION

          tar -czf "openlist-frontend-dist-lite-${VERSION_TAG}.tar.gz" -C dist .

          mkdir -p lite-release
          mv "openlist-frontend-dist-lite-${VERSION_TAG}.tar.gz" lite-release/

      - name: Verify archive structure
        run: |
          echo "=== standard ==="
          tar -tzf "release/openlist-frontend-dist-${VERSION_TAG}.tar.gz" | head -20
          echo "=== lite ==="
          tar -tzf "lite-release/openlist-frontend-dist-lite-${VERSION_TAG}.tar.gz" | head -10
          echo "=== version file ==="
          tar -xzOf "release/openlist-frontend-dist-${VERSION_TAG}.tar.gz" ./VERSION

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: ${{ env.VERSION_TAG }}
          body: |
            Fork build of OpenList Frontend ${{ env.VERSION_TAG }}

            - `openlist-frontend-dist-${{ env.VERSION_TAG }}.tar.gz`（标准版，归档根为 `./`）
            - `openlist-frontend-dist-lite-${{ env.VERSION_TAG }}.tar.gz`（精简版）
            - `i18n.tar.gz`（多语言包）

            产物结构与上游 `build.sh --release --compress` 一致，可直接被 OpenList 后端消费。
          files: |
            release/openlist-frontend-dist-${{ env.VERSION_TAG }}.tar.gz
            release/i18n.tar.gz
            lite-release/openlist-frontend-dist-lite-${{ env.VERSION_TAG }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
